name: solo-remote

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solo}
      POSTGRES_USER: ${POSTGRES_USER:-solo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solo} -d ${POSTGRES_DB:-solo}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["server"]
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ALLOWED_ORIGINS: https://${SOLO_DOMAIN:?set SOLO_DOMAIN}
      PUBLIC_URL: https://${SOLO_DOMAIN:?set SOLO_DOMAIN}
      AUTH_MAIL_TRANSPORT: ${AUTH_MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:-}
      TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:-}
      TENCENT_SES_REGION: ${TENCENT_SES_REGION:-ap-guangzhou}
      TENCENT_SES_FROM: ${TENCENT_SES_FROM:-}
      TENCENT_SES_TEMPLATE_ID: ${TENCENT_SES_TEMPLATE_ID:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      ATTACHMENTS_DIR: /var/lib/solo/attachments
      ARTIFACTS_DIR: /var/lib/solo/artifacts
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - attachments:/var/lib/solo/attachments
      - artifacts:/var/lib/solo/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${SOLO_DOMAIN:?set SOLO_DOMAIN}
        NEXT_PUBLIC_INSTALL_URL: ${NEXT_PUBLIC_INSTALL_URL:-https://raw.githubusercontent.com/solo-agent/solo/master/scripts/install.sh}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      server:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      SOLO_DOMAIN: ${SOLO_DOMAIN:?set SOLO_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  postgres-data:
  attachments:
  artifacts:
  caddy-data:
  caddy-config:
